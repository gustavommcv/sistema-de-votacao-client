<section class="home">
  @if (authService.isAuthenticated$ | async) {
    <app-button [isLink]="true" route="/polls/create" class="home__create-btn">
      Criar Enquete
    </app-button>
  }

  <h2 class="home__title">Enquetes Disponíveis</h2>

  @if (loading) {
    <div class="home__loading">Carregando enquetes...</div>
  }

  @if (error) {
    <div class="home__error">{{ error }}</div>
  }

  <div class="home__poll-list">
    @for (poll of polls; track poll.id) {
      <app-poll-card [poll]="poll" (pollDeleted)="removePoll($event)" />
    }
  </div>

  @if (!loading && polls.length === 0) {
    <div class="home__empty-message">
      Nenhuma enquete disponível no momento.
    </div>
  }
</section>
